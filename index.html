<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#0B1020"><meta name="description" content="종서만의 작은 지출 실험실. 오늘의 여유를 기록해요."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="css/styles.css"><title>돈 모으자, 종서야</title></head>
<body><div class="shell"><header><a href="#home" class="brand"><span class="logo"><img src="icons/icon.svg" alt=""></span><span>돈 모으자, 종서야<small>JONGSEO'S MONEY LAB</small></span></a><button id="quick-backup" class="quiet">↗ JSON 백업</button></header>
<main id="app" tabindex="-1"></main><footer>내 기기에 저장되는 나만의 절약 노트 <span id="backup-date"></span></footer></div>
<nav aria-label="주요 메뉴"><a href="#home">⌂<span>홈</span></a><a href="#history">≡<span>지출 내역</span></a><a href="#stats">▥<span>통계</span></a><a href="#settings">⚙<span>설정</span></a></nav>
<dialog id="expense-dialog"><form id="expense-form"><div class="section-title"><h2 id="form-title">지출 기록</h2><button type="button" id="close-dialog" class="quiet" aria-label="닫기">✕</button></div><input name="id" type="hidden"><label>금액 (원)<input name="amount" type="number" inputmode="numeric" min="1" max="100000000" step="1" required placeholder="0"></label><div class="columns"><label>카테고리<select name="category" aria-label="카테고리"></select></label><label>날짜<input name="date" type="date" required></label></div><label>메모<input name="memo" maxlength="300" placeholder="어디에 사용했나요?"></label><label class="check"><input name="fixed" type="checkbox">고정비로 기록 (하루 예산에서 제외)</label><p class="hint">고정비도 실제 지출한 날짜마다 기록해 주세요.</p><button class="primary" type="submit">저장하기</button></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><input id="import-file" type="file" accept="application/json,.json" hidden><script type="module" src="js/app.js"></script></body></html>
